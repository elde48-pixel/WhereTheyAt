<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Find the Hidden Objects</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Screens */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }
    .screen.active {
      display: flex;
    }

    /* ================= HOME / LEVEL SELECT ================= */
    #home-screen {
      padding: 24px 16px;
      overflow-y: auto;
      align-items: center;
    }

    .header-title {
      text-align: center;
      margin-bottom: 24px;
    }
    .header-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .header-title p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
      max-width: 480px;
    }

    .level-card {
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid transparent;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .level-card:active {
      transform: scale(0.98);
    }
    .level-card.completed {
      border-color: var(--success);
    }

    .level-thumb-wrap {
      position: relative;
      width: 100%;
      height: 150px;
      background: #000;
    }
    .level-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .level-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
    }
    .best-time-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--success);
      color: #064e3b;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .level-info {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .level-info h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .play-pill {
      background: var(--primary);
      color: #000;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 999px;
    }

    /* ================= MODAL (BRIEFING & VICTORY) ================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid var(--surface-light);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-card h2 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .modal-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .target-preview-list {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .target-preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 90px;
    }
    .target-img-box {
      width: 76px;
      height: 76px;
      border-radius: 14px;
      background: var(--bg);
      border: 2px solid var(--surface-light);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-weight: 800;
      color: var(--primary);
      font-size: 1.2rem;
    }
    .target-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .target-preview-item span {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.2;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active {
      opacity: 0.85;
    }
    .btn-primary {
      background: var(--primary);
      color: #000;
    }
    .btn-secondary {
      background: var(--surface-light);
      color: var(--text);
      margin-top: 10px;
    }

    .stat-box {
      background: var(--bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .stat-box .time-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--success);
      font-variant-numeric: tabular-nums;
    }
    .stat-box .best-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ================= GAMEPLAY SCREEN ================= */
    .top-bar {
      background: var(--surface);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--surface-light);
      z-index: 20;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface-light);
      color: var(--text);
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .hud-targets {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .hud-target {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg);
      border: 2px solid var(--surface-light);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .hud-target img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hud-target.found {
      border-color: var(--success);
    }
    .hud-target.found::after {
      content: "✓";
      position: absolute;
      inset: 0;
      background: rgba(16, 185, 129, 0.8);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 1rem;
      color: var(--primary);
      min-width: 54px;
      text-align: right;
    }

    /* Scrollable & Zoomable Viewport */
    .viewport {
      flex: 1;
      overflow: auto;
      position: relative;
      background: #090d16;
      -webkit-overflow-scrolling: touch;
    }

    .canvas-container {
      position: relative;
      transform-origin: 0 0;
      display: inline-block;
    }

    .game-image {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: auto;
    }

    /* Found Ring Marker */
    .found-circle {
      position: absolute;
      width: 54px;
      height: 54px;
      border: 4px solid #ef4444;
      box-shadow: 0 0 0 3px #ffffff, 0 4px 12px rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      animation: popCircle 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popCircle {
      to {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* Miss Feedback Ripple */
    .miss-marker {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
      animation: fadeMiss 0.45s ease-out forwards;
    }
    @keyframes fadeMiss {
      to {
        transform: translate(-50%, -50%) scale(1.4);
        opacity: 0;
      }
    }

    /* Floating Zoom Controls */
    .zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
    }
    .zoom-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid var(--surface-light);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:active {
      background: var(--primary);
      color: #000;
    }
    .zoom-level-tag {
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      text-align: center;
      padding: 3px 6px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- ================= SCREEN 1: LEVEL SELECT ================= -->
  <div id="home-screen" class="screen active">
    <div class="header-title">
      <h1>Hidden Object Quest</h1>
      <p>Select a level to begin searching</p>
    </div>
    <div id="level-grid" class="level-grid"></div>
  </div>

  <!-- ================= SCREEN 2: GAMEPLAY ================= -->
  <div id="game-screen" class="screen">
    <div class="top-bar">
      <button class="icon-btn" onclick="exitToMenu()">← Levels</button>
      <div id="hud-targets" class="hud-targets"></div>
      <div id="timer-display" class="timer-display">00:00</div>
    </div>

    <div id="viewport" class="viewport">
      <div id="canvas-container" class="canvas-container">
        <img id="game-image" class="game-image" src="" alt="Hidden Object Scene" />
        <div id="markers-layer"></div>
      </div>
    </div>

    <div class="zoom-controls">
      <button class="zoom-btn" onclick="changeZoom(0.4)" aria-label="Zoom In">+</button>
      <div id="zoom-label" class="zoom-level-tag">1.5x</div>
      <button class="zoom-btn" onclick="changeZoom(-0.4)" aria-label="Zoom Out">−</button>
      <button class="zoom-btn" style="font-size: 0.8rem;" onclick="resetZoom()" aria-label="Reset Zoom">Fit</button>
    </div>
  </div>

  <!-- ================= MODAL: PRE-LEVEL BRIEFING ================= -->
  <div id="briefing-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="briefing-title">Level 1</h2>
      <p class="modal-subtitle">Find the hidden objects</p>
      <div id="briefing-targets" class="target-preview-list"></div>
      <button class="btn btn-primary" onclick="startLevelGameplay()">Start Searching</button>
      <button class="btn btn-secondary" onclick="closeBriefing()">Back</button>
    </div>
  </div>

  <!-- ================= MODAL: LEVEL COMPLETE ================= -->
  <div id="victory-modal" class="modal-overlay">
    <div class="modal-card">
      <h2>Level Complete!</h2>
      <p id="victory-level-name" class="modal-subtitle"></p>
      <div class="stat-box">
        <div id="final-time" class="time-value">00:00</div>
        <div id="best-time-label" class="best-label">Best Time: --:--</div>
      </div>
      <button id="next-level-btn" class="btn btn-primary" onclick="goToNextLevel()">Next Level →</button>
      <button class="btn btn-secondary" onclick="exitToMenu()">All Levels</button>
    </div>
  </div>

  <script>
    /**
     * GAME CONFIGURATION & COORDINATES
     * Matched to your exact filenames (note: l1_... uses lowercase L, I2_... and I3_... use uppercase I).
     */
    const LEVELS = [
      {
        id: 0,

          { id: "l1_3", name: "Gold Shield", icon: "l1_obj3.jpg", x: 8.2, y: 95.5, radius: 5.5 }
        ]
      },
      {
        id: 1,
        number: 2,
        title: "Irish I Could Find Her",
        image: "Irish I Could Find Her.jpg",
        targets: [
          { id: "l2_1", name: "Irish Lass", icon: "I2_obj1.jpg", x: 29.5, y: 71.5, radius: 5.5 },
          { id: "l2_2", name: "Pint of Stout", icon: "I2_obj2.jpg", x: 37.5, y: 43.0, radius: 5.5 },

      },
      {

        targets: [
          { id: "l3_1", name: "Sunbathing Bear", icon: "I3_obj1.jpg", x: 47.5, y: 43.0, radius: 5.5 },
          { id: "l3_2", name: "Bear Food", icon: "I3_obj2.jpg", x: 83.5, y: 35.0, radius: 5.5 },
          { id: "l3_3", name: "Bear Cap", icon: "I3_obj3.jpg", x: 7.5, y: 98.0, radius: 5.5 }
        ]
      }
    ];

    let currentLevelIndex = 0;
    let foundTargets = new Set();
    let timerInterval = null;
    let startTime = 0;
    let elapsedSeconds = 0;
    let currentZoom = 1.5;
    const MIN_ZOOM = 1.0;
    const MAX_ZOOM = 3.8;

    function getSavedTimes() {
      try {
        return JSON.parse(localStorage.getItem("hiddenObjectBestTimes")) || {};
      } catch {
        return {};
      }
    }

    function saveBestTime(levelId, seconds) {
      const times = getSavedTimes();
      if (!times[levelId] || seconds < times[levelId]) {
        times[levelId] = seconds;
        localStorage.setItem("hiddenObjectBestTimes", JSON.stringify(times));
      }
      return times[levelId];
    }

    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
      const secs = (totalSeconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function renderLevelMenu() {
      const grid = document.getElementById("level-grid");
      const savedTimes = getSavedTimes();
      grid.innerHTML = "";

      LEVELS.forEach((level, idx) => {
        const best = savedTimes[level.id];
        const card = document.createElement("div");
        card.className =
